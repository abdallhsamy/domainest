[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri GUI binary (required explicitly once other [[bin]] targets exist)
[[bin]]
name = "app"
path = "src/main.rs"

[[bin]]
name = "domainest"
path = "src/bin/domainest.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
thiserror = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
dirs = "6"
fs2 = "0.4"
anyhow = "1"
nix = { version = "0.29", features = ["signal", "process"] }
libc = "0.2"
tokio = { version = "1.45", features = ["net", "rt", "macros", "time"] }
hickory-proto = "0.26"
clap = { version = "4", features = ["derive"] }
